# Push 到 main 后：GitHub 上 build，再打包上传到宝塔网站目录
#
# Secrets（必填）：SSH_HOST / SSH_USER / SSH_PRIVATE_KEY / WEB_ROOT
# 可选：SSH_PORT（默认 22）

name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install & build
        run: |
          npm ci
          npm run build
          test -f apps/web/dist/index.html
          ls -la apps/web/dist

      - name: Deploy to Baota via tar+scp
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          WEB_ROOT: ${{ secrets.WEB_ROOT }}
        run: |
          set -euo pipefail

          if [ -z "${SSH_HOST}" ] || [ -z "${SSH_USER}" ] || [ -z "${SSH_PRIVATE_KEY}" ] || [ -z "${WEB_ROOT}" ]; then
            echo "缺少 Secrets：请确认 SSH_HOST / SSH_USER / SSH_PRIVATE_KEY / WEB_ROOT 都已配置"
            exit 1
          fi

          mkdir -p ~/.ssh
          # 去掉 Windows 粘贴私钥可能带的 \r，避免 invalid format
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          echo "==> 私钥指纹（用于确认密钥是否加载成功）"
          ssh-keygen -lf ~/.ssh/deploy_key || {
            echo "SSH_PRIVATE_KEY 格式不对。请重新复制本机 deploy_removewatermarks 私钥全文到 Secret"
            exit 1
          }

          echo "==> 测试 SSH"
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o IdentitiesOnly=yes \
            "${SSH_USER}@${SSH_HOST}" \
            "echo SSH_OK && ls -ld '${WEB_ROOT}'"

          echo "==> 打包 dist"
          tar -C apps/web/dist -czf /tmp/web-dist.tar.gz .

          echo "==> 上传压缩包"
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o IdentitiesOnly=yes \
            /tmp/web-dist.tar.gz \
            "${SSH_USER}@${SSH_HOST}:/tmp/web-dist.tar.gz"

          echo "==> 解压覆盖网站目录（保留 .user.ini）"
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o IdentitiesOnly=yes \
            "${SSH_USER}@${SSH_HOST}" \
            "mkdir -p '${WEB_ROOT}' && tar -xzf /tmp/web-dist.tar.gz -C '${WEB_ROOT}' && rm -f /tmp/web-dist.tar.gz && ls -la '${WEB_ROOT}' && test -f '${WEB_ROOT}/index.html' && echo DEPLOY_OK"
