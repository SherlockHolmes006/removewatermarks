# Push 到 main 后：GitHub 上 build，再打包上传到宝塔网站目录
#
# Secrets（必填）：SSH_HOST / SSH_USER / SSH_PRIVATE_KEY / WEB_ROOT
# 可选：SSH_PORT（默认 22）
#
# 不用服务器上的 rsync；用 tar+scp，并保留宝塔的 .user.ini

name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install & build
        run: |
          npm ci
          npm run build
          test -f apps/web/dist/index.html
          ls -la apps/web/dist

      - name: Deploy to Baota via tar+scp
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          WEB_ROOT: ${{ secrets.WEB_ROOT }}
        run: |
          set -euo pipefail

          if [ -z "${SSH_HOST}" ] || [ -z "${SSH_USER}" ] || [ -z "${SSH_PRIVATE_KEY}" ] || [ -z "${WEB_ROOT}" ]; then
            echo "缺少 Secrets：请确认 SSH_HOST / SSH_USER / SSH_PRIVATE_KEY / WEB_ROOT 都已配置"
            exit 1
          fi

          mkdir -p ~/.ssh
          # 兼容私钥末尾没有换行的情况
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          SSH_OPTS="-i ~/.ssh/deploy_key -p ${SSH_PORT} -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes"

          echo "==> 测试 SSH 连接"
          ssh $SSH_OPTS "${SSH_USER}@${SSH_HOST}" "echo ok && pwd && ls -ld '${WEB_ROOT}'"

          echo "==> 打包 dist"
          tar -C apps/web/dist -czf /tmp/web-dist.tar.gz .

          echo "==> 上传并解压到网站目录（保留 .user.ini）"
          scp $SSH_OPTS /tmp/web-dist.tar.gz "${SSH_USER}@${SSH_HOST}:/tmp/web-dist.tar.gz"

          ssh $SSH_OPTS "${SSH_USER}@${SSH_HOST}" bash -s <<EOF
          set -euo pipefail
          WEB_ROOT='${WEB_ROOT}'
          mkdir -p "\$WEB_ROOT"
          # 只清站点内容，不动宝塔保护文件
          find "\$WEB_ROOT" -mindepth 1 \
            ! -name '.user.ini' \
            ! -name '.htaccess' \
            -exec rm -rf {} +
          tar -xzf /tmp/web-dist.tar.gz -C "\$WEB_ROOT"
          rm -f /tmp/web-dist.tar.gz
          ls -la "\$WEB_ROOT"
          test -f "\$WEB_ROOT/index.html"
          echo "Deploy success"
          EOF
