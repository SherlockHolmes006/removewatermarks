# Push 到 main 后：GitHub 上 build，再打包上传到宝塔网站目录
#
# Secrets（必填）：
#   SSH_HOST / SSH_USER / WEB_ROOT
#   SSH_PRIVATE_KEY  —— 推荐填「一行 Base64」（见下方），也兼容原始私钥文本
# 可选：SSH_PORT（默认 22）
#
# 生成 Base64（Windows PowerShell，会复制到剪贴板）：
#   $p="$env:USERPROFILE\.ssh\deploy_removewatermarks"
#   Set-Clipboard ([Convert]::ToBase64String([IO.File]::ReadAllBytes($p)))

name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install & build
        run: |
          npm ci
          npm run build
          test -f apps/web/dist/index.html
          ls -la apps/web/dist

      - name: Deploy to Baota via tar+scp
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          WEB_ROOT: ${{ secrets.WEB_ROOT }}
        run: |
          set -euo pipefail

          if [ -z "${SSH_HOST}" ] || [ -z "${SSH_USER}" ] || [ -z "${SSH_PRIVATE_KEY}" ] || [ -z "${WEB_ROOT}" ]; then
            echo "缺少 Secrets：请确认 SSH_HOST / SSH_USER / SSH_PRIVATE_KEY / WEB_ROOT 都已配置"
            exit 1
          fi

          mkdir -p ~/.ssh
          KEY_RAW=$(printf '%s' "$SSH_PRIVATE_KEY" | tr -d '\r')

          # 支持两种格式：
          # 1) 原始私钥（含 BEGIN PRIVATE KEY）
          # 2) 一行 Base64（推荐，避免粘贴换行丢失）
          if printf '%s' "$KEY_RAW" | grep -q "BEGIN .*PRIVATE KEY"; then
            echo "==> 检测到原始私钥文本"
            printf '%s\n' "$KEY_RAW" > ~/.ssh/deploy_key
          else
            echo "==> 按 Base64 解码私钥"
            if ! printf '%s' "$KEY_RAW" | base64 -d > ~/.ssh/deploy_key 2>/tmp/b64err.txt; then
              echo "Base64 解码失败："
              cat /tmp/b64err.txt || true
              echo "请重新生成并粘贴一整行 Base64 到 SSH_PRIVATE_KEY"
              exit 1
            fi
          fi

          chmod 600 ~/.ssh/deploy_key
          echo "首行: $(head -n 1 ~/.ssh/deploy_key)"
          echo "末行: $(tail -n 1 ~/.ssh/deploy_key)"

          if ! grep -q "BEGIN .*PRIVATE KEY" ~/.ssh/deploy_key; then
            echo "错误：解码后仍不是私钥。请确认 Secret 用的是私钥 Base64，不是 .pub"
            exit 1
          fi

          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/tmp/derived.pub 2>/tmp/keyerr.txt; then
            echo "错误：私钥无法解析："
            cat /tmp/keyerr.txt
            exit 1
          fi
          echo "==> 私钥可用，对应公钥："
          cat /tmp/derived.pub

          echo "==> 测试 SSH"
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o IdentitiesOnly=yes \
            "${SSH_USER}@${SSH_HOST}" \
            "echo SSH_OK && ls -ld '${WEB_ROOT}'"

          echo "==> 打包 dist"
          tar -C apps/web/dist -czf /tmp/web-dist.tar.gz .

          echo "==> 上传压缩包"
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o IdentitiesOnly=yes \
            /tmp/web-dist.tar.gz \
            "${SSH_USER}@${SSH_HOST}:/tmp/web-dist.tar.gz"

          echo "==> 解压覆盖网站目录"
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o IdentitiesOnly=yes \
            "${SSH_USER}@${SSH_HOST}" \
            "mkdir -p '${WEB_ROOT}' && tar -xzf /tmp/web-dist.tar.gz -C '${WEB_ROOT}' && rm -f /tmp/web-dist.tar.gz && ls -la '${WEB_ROOT}' && test -f '${WEB_ROOT}/index.html' && echo DEPLOY_OK"
