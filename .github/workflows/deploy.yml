# Push 到 main 后：GitHub 上 build，再 rsync 同步到宝塔网站目录
#
# Secrets：
#   SSH_HOST / SSH_USER / SSH_PRIVATE_KEY / WEB_ROOT  （必填）
#   SSH_PORT  （可选，默认 22）
#
# 宝塔注意：不会删除 .user.ini / .htaccess，避免 Operation not permitted

name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install & build
        run: |
          npm ci
          npm run build
          test -f apps/web/dist/index.html
          ls -la apps/web/dist

      - name: Deploy to Baota via rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          WEB_ROOT: ${{ secrets.WEB_ROOT }}
        run: |
          set -e
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$WEB_ROOT" ]; then
            echo "缺少 Secrets：请确认已配置 SSH_HOST / SSH_USER / SSH_PRIVATE_KEY / WEB_ROOT"
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          rsync -avz --delete \
            --exclude '.user.ini' \
            --exclude '.htaccess' \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=accept-new" \
            apps/web/dist/ \
            "${SSH_USER}@${SSH_HOST}:${WEB_ROOT}/"

          echo "Deploy done -> ${SSH_USER}@${SSH_HOST}:${WEB_ROOT}/"
